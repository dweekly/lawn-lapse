name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Run Prettier check
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        # Current Node LTS lines. package.json "engines" states the true floor
        # (set by the dependencies), which is lower than what CI exercises.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Run tests
        run: npm test

      - name: Check syntax of every module
        run: for f in *.js; do node --check "$f"; done

      - name: Check public exports
        run: |
          node -e "
            Promise.all([import('./lawn-lapse.js'), import('./config.js')]).then(([cli, config]) => {
              const missing = [
                ...['runSetup', 'runCapture', 'runStatus'].filter((fn) => !cli[fn]),
                ...['loadConfig', 'saveConfig', 'updateConfig', 'getConfigPath'].filter((fn) => !config[fn]),
              ];
              if (missing.length) throw new Error('Missing exports: ' + missing.join(', '));
              console.log('✓ All expected functions are exported');
            }).catch((e) => { console.error(e.message); process.exit(1); });
          "
